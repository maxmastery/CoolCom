<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ติดต่อเรา | CoolCom</title>
    <meta name="description" content="ติดต่อทีมงาน CoolCom เราพร้อมช่วยเหลือคุณทุกเรื่อง">
    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="Contact Us - ติดต่อเรา | CoolCom">
    <meta property="og:description" content="ติดต่อทีมงาน CoolCom เราพร้อมช่วยเหลือคุณทุกเรื่อง">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1ZlwJVV6rZ0Atekv3QCXnIfKiK1587em5">
    <meta property="og:url" content="https://coolcom.click/contact.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1lkEII-FEDJpZt4dCuCa5-WU1ivEm8joC&sz=w128">
</head>
<body>
    <div class="bg-diag-lines"></div>
    <div class="bg-blur light"></div>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Contact Main -->
    <section class="contact-section" style="padding-top: 7rem;">
        <div class="contact-inner">
            <div class="contact-layout">
                <!-- Left: Info -->
                <div class="contact-info">
                    <span class="contact-label"><i class="fa-solid fa-phone"></i> Contact Us</span>
                    <h1 class="contact-title">ต้องการความ<span class="text-yellow">ช่วยเหลือ?</span><br>เราพร้อมอยู่ตรงนี้</h1>

                    <div class="contact-channels">
                        <div class="cc-item">
                            <span class="cc-type">สอบถามทั่วไป:</span>
                            <a href="mailto:contact@coolcom.click" class="cc-link">contact@coolcom.click</a>
                        </div>
                    </div>

                    <div class="contact-social">
                        <a href="https://www.facebook.com/profile.php?id=61572070237617" target="_blank" class="cs-btn"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
                        <a href="#" class="cs-btn" style="opacity: 0.5; pointer-events: none;"><i class="fa-brands fa-youtube"></i> YouTube</a>
                    </div>
                </div>

                <!-- Right: Form -->
                <div class="contact-form-card">
                    <h3 class="cfc-title">ส่งข้อความถึงเรา</h3>
                    <p class="cfc-sub">เราจะตอบกลับภายใน 1-3 วันทำการ</p>
                    <form class="contact-form" id="contact-form">
                        <div class="cf-row">
                            <div class="cf-group">
                                <label>ชื่อ *</label>
                                <input type="text" id="cf-first" placeholder="ชื่อของคุณ">
                            </div>
                            <div class="cf-group">
                                <label>นามสกุล</label>
                                <input type="text" id="cf-last" placeholder="นามสกุลของคุณ">
                            </div>
                        </div>
                        <div class="cf-row">
                            <div class="cf-group">
                                <label>อีเมล *</label>
                                <input type="email" id="cf-email" placeholder="your@email.com">
                            </div>
                            <div class="cf-group">
                                <label>เบอร์โทรศัพท์</label>
                                <input type="tel" id="cf-phone" placeholder="0xx-xxx-xxxx">
                            </div>
                        </div>
                        <div class="cf-group full">
                            <label>เรื่อง *</label>
                            <select id="cf-topic">
                                <option value="">เลือกหัวข้อ...</option>
                                <option>สอบถามคอร์สเรียน</option>
                                <option>สอบถามเครื่องมือ</option>
                                <option>ร่วมงานกับเรา</option>
                                <option>แจ้งปัญหาการใช้งาน</option>
                                <option>อื่น ๆ</option>
                            </select>
                        </div>
                        <div class="cf-group full">
                            <label>ข้อความ</label>
                            <textarea id="cf-message" rows="5" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea>
                        </div>
                        <button type="submit" class="cf-submit" id="cf-submit">
                            <i class="fa-solid fa-paper-plane"></i> ส่งข้อความ
                        </button>
                        <p class="cf-note">ปกติเราจะตอบกลับภายใน 1-3 วันทำการ</p>
                    </form>
                    <div class="cf-success" id="cf-success" style="display:none">
                        <i class="fa-solid fa-circle-check"></i>
                        <h4>ส่งข้อความสำเร็จ!</h4>
                        <p>ขอบคุณที่ติดต่อเรา เราจะตอบกลับโดยเร็วที่สุด</p>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- Footer -->
    <footer class="site-footer"></footer>

    <script src="navbar.js"></script>
    <script>
        // Page transition on link click - Smooth fade out
        document.querySelectorAll('a[href$=".html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    e.preventDefault();
                    // Smooth fade out all content except navbar with slide down
                    document.querySelectorAll('body > *:not(#navbar-container)').forEach(el => {
                        el.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                    });
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const firstName = document.getElementById('cf-first').value.trim();
            const email = document.getElementById('cf-email').value.trim();
            const topic = document.getElementById('cf-topic').value;
            if (!firstName || !email || !topic) {
                alert('กรุณากรอกข้อมูลที่จำเป็น (ชื่อ, อีเมล, และหัวข้อ)');
                return;
            }
            document.querySelector('.contact-form').style.display = 'none';
            document.getElementById('cf-success').style.display = 'flex';
        });
    </script>
<script type="module" src="js/visitorTracker.js"></script><script src="footer.js"></script>
</body>
</html>
