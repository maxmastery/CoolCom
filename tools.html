    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="Cool Tools - เครื่องมือสำหรับครู | CoolCom">
    <meta property="og:description" content="เครื่องมือสำหรับช่วยการทำงานด้านการศึกษา เพิ่มประสิทธิภาพและสะดวกรวดเร็ว">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1ZlwJVV6rZ0Atekv3QCXnIfKiK1587em5">
    <meta property="og:url" content="https://coolcom.click/tools.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://kdeiauloliuojwadbzfd.supabase.co/storage/v1/object/public/coolcom-media/CoolCom%20media/Coolcom%20favicon.png">
</head>
<body>
    <div class="bg-diag-lines"></div>
    <div class="bg-blur light"></div>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Tools Header -->
    <section class="tools-main" style="padding-top: 7rem;">
        <div class="tools-inner" style="text-align: center; margin-bottom: 2rem;">
            <span class="page-hero-badge"><i class="fa-solid fa-wrench"></i> Cool Tools</span>
            <h1 class="page-hero-title">เครื่องมือ<span class="text-yellow">สำหรับครู</span></h1>
            <p class="page-hero-sub tools-hero-sub">เครื่องมือสำหรับช่วยการทำงานด้านการศึกษา ให้เพิ่มประสิทธิภาพ และสะดวกรวดเร็ว</p>
        </div>
    </section>

    <!-- Tools Section -->
    <section class="tools-main" style="padding-top: 0;">
        <div class="tools-inner">
            <div class="tools-header-row">
                <div>
                    <span class="tools-pre-label">Our Tools</span>
                    <h2 class="tools-main-title">เครื่องมือที่ช่วยให้<br>การสอนของคุณ<span class="text-yellow">ดียิ่งขึ้น</span></h2>
                </div>
                <a href="#" class="btn-tools-outline">ดูทั้งหมด <i class="fa-solid fa-arrow-right"></i></a>
            </div>

            <div id="tools-featured-container">
                <!-- Featured tools will be dynamically injected here by js/renderTools.js -->
            </div>

        </div>
    </section>

    <!-- More Tools Grid -->
    <section class="tools-grid-section">
        <div class="tools-inner">
            <h2 class="tools-grid-title">เครื่องมืออื่น ๆ</h2>
            <div class="tools-mini-grid" id="tools-grid">
                <!-- Regular tools will be dynamically injected here by js/renderTools.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <script src="navbar.js"></script>
    <script type="module" src="js/renderTools.js"></script>
    <script src="footer.js"></script>
    <script>
        // Page transition on link click - Smooth fade out
        document.querySelectorAll('a[href$=".html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    e.preventDefault();
                    // Smooth fade out all content except navbar with slide down
                    document.querySelectorAll('body > *:not(#navbar-container)').forEach(el => {
                        el.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                    });
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });
    </script>
    <script src="footer.js"></script>
<script type="module" src="js/visitorTracker.js"></script></body>
</html>
