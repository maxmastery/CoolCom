<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Shop - ร้านสินค้าสุดคูล | CoolCom</title>
    <meta name="description" content="ช้อปปิ้งสินค้าคุณภาพสำหรับครู อีบุ๊ค คอร์สพิเศษ และอุปกรณ์การสอน">
    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="Cool Shop - ร้านสินค้าสุดคูล | CoolCom">
    <meta property="og:description" content="ช้อปปิ้งสินค้าคุณภาพสำหรับครู อีบุ๊ค คอร์สพิเศษ และอุปกรณ์การสอน">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1ZlwJVV6rZ0Atekv3QCXnIfKiK1587em5">
    <meta property="og:url" content="https://coolcom.click/shop.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1lkEII-FEDJpZt4dCuCa5-WU1ivEm8joC&sz=w128">
</head>
<body>
    <div class="bg-diag-lines"></div>
    <div class="bg-blur light"></div>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Shop Header -->
    <section class="shop-hero" style="padding-top: 7rem;">
        <div class="shop-hero-inner">
            <div class="shop-hero-text">
                <span class="page-hero-badge"><i class="fa-solid fa-store"></i> Cool Shop</span>
                <h1 class="shop-hero-title">ร้านสินค้า<span class="text-yellow">สุดคูล</span><br>สำหรับครูไทย</h1>
                <p class="shop-hero-sub">อีบุ๊ค คอร์สพิเศษ สื่อการสอน และอุปกรณ์ดี ๆ คัดสรรมาเพื่อครูโดยเฉพาะ</p>
                <div class="shop-search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="shop-search" placeholder="ค้นหาสินค้า...">
                </div>
            </div>
            <div class="shop-hero-img">
                <img src="https://drive.google.com/thumbnail?id=1Z34-cQtv_TEhWB1UMI6JniVL1DkjtKbB&sz=w1000" alt="Cool Shop">
            </div>
        </div>
    </section>

    <!-- Category Tabs -->
    <section class="shop-main">
        <div class="shop-inner">
            <div class="shop-cats">
                <button class="shop-cat-btn active" data-cat="all"><i class="fa-solid fa-th-large"></i> ทั้งหมด</button>
                <button class="shop-cat-btn" data-cat="ebook"><i class="fa-solid fa-book"></i> อีบุ๊ค</button>
                <button class="shop-cat-btn" data-cat="course"><i class="fa-solid fa-graduation-cap"></i> คอร์สพิเศษ</button>
                <button class="shop-cat-btn" data-cat="media"><i class="fa-solid fa-palette"></i> สื่อการสอน</button>
                <button class="shop-cat-btn" data-cat="tool"><i class="fa-solid fa-wrench"></i> เครื่องมือ</button>
            </div>

            <!-- Featured Banner (Dynamic) -->
            <div id="shop-featured-container"></div>

            <!-- Products Grid -->
            <div class="shop-grid" id="shop-grid">
                <!-- Dynamic content will be loaded here -->
            </div>

            <!-- Load More -->
            <div class="courses-load-more" id="shop-load-more" style="display: none;">
                <button class="btn-load-more">ดูสินค้าเพิ่มเติม <i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <script src="navbar.js"></script>
    <script type="module" src="js/renderShop.js"></script>
    <script>
        // Page transition on link click - Smooth fade out
        document.querySelectorAll('a[href$=".html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    e.preventDefault();
                    // Smooth fade out all content except navbar with slide down
                    document.querySelectorAll('body > *:not(#navbar-container)').forEach(el => {
                        el.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                    });
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        // Category filter
        document.querySelectorAll('.shop-cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.shop-cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const cat = btn.dataset.cat;
                document.querySelectorAll('.shop-product-card').forEach(card => {
                    card.style.display = (cat === 'all' || card.dataset.cat === cat) ? '' : 'none';
                });
            });
        });

        // Search
        document.getElementById('shop-search').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            document.querySelectorAll('.shop-product-card').forEach(card => {
                const title = card.querySelector('.spc-title')?.textContent.toLowerCase() || '';
                card.style.display = title.includes(q) ? '' : 'none';
            });
        });

        // Add to cart feedback
        document.querySelectorAll('.spc-add-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.style.background = '#22c55e';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-solid fa-cart-plus"></i>';
                    btn.style.background = '';
                }, 1500);
            });
        });
    </script>
<script type="module" src="js/visitorTracker.js"></script><script src="footer.js"></script>
</body>
</html>
