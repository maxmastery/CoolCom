<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Blog - บทความสำหรับครูไทย | CoolCom</title>
    <meta name="description" content="บทความ ข่าวสาร และเทคโนโลยีการศึกษา สำหรับครูไทยทุกคน">
    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="Cool Blog - บทความสำหรับครูไทย | CoolCom">
    <meta property="og:description" content="บทความ ข่าวสาร และเทคโนโลยีการศึกษา สำหรับครูไทยทุกคน">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1ZlwJVV6rZ0Atekv3QCXnIfKiK1587em5">
    <meta property="og:url" content="https://coolcom.click/blog.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1lkEII-FEDJpZt4dCuCa5-WU1ivEm8joC&sz=w128">
</head>
<body>
    <div class="bg-diag-lines"></div>
    <div class="bg-blur light"></div>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Blog Hero Header -->
    <section class="blog-page-hero">
        <div class="blog-hero-overlay"></div>
        <div class="blog-hero-content">
            <span class="blog-hero-badge">BLOG</span>
            <h1 class="blog-hero-title">Cool Blog</h1>
            <p class="blog-hero-sub">บทความ ข่าวสาร และเทคโนโลยีการศึกษา สำหรับครูไทยทุกคน</p>
        </div>
    </section>

    <!-- Blog Filter -->
    <section class="blog-page-main" style="padding-top: 0;">
        <div class="blog-page-inner">
            <!-- Category filter tabs -->
            <div class="blog-filter-tabs" style="margin-top: 3rem; margin-bottom: 2rem; position: relative;">
                <button class="blog-tab active" data-cat="all">ทั้งหมด</button>
                <button class="blog-tab" data-cat="บทความ">บทความ</button>
                <button class="blog-tab" data-cat="ข่าวสาร">ข่าวสาร</button>
                <button class="blog-tab" data-cat="เทคโนโลยี">เทคโนโลยี</button>
                <button class="blog-tab" data-cat="วิทยาศาสตร์">วิทยาศาสตร์</button>
            </div>

            <!-- Blog Grid -->
            <div class="blog-page-grid" id="blog-grid">
                <!-- Dynamic blogs will be loaded here -->
            </div>

            <!-- Pagination -->
            <div class="blog-pagination">
                <button class="pg-btn disabled"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="pg-btn active">1</button>
                <button class="pg-btn">2</button>
                <button class="pg-btn">3</button>
                <span class="pg-dots">...</span>
                <button class="pg-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <script src="navbar.js"></script>
    <script>
        // Page transition on link click - Smooth fade out
        document.querySelectorAll('a[href$=".html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    e.preventDefault();
                    // Smooth fade out all content except navbar with slide down
                    document.querySelectorAll('body > *:not(#navbar-container)').forEach(el => {
                        el.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                    });
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });
    </script>
    <script type="module" src="js/renderBlog.js"></script>
<script type="module" src="js/visitorTracker.js"></script><script src="footer.js"></script>
</body>
</html>
