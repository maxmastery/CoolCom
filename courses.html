<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Courses - คอร์สเรียนสำหรับครูไทย | CoolCom</title>
    <meta name="description" content="คอร์สเรียนออนไลน์ดี ๆ หลากหลายหลักสูตร สำหรับครูไทยทุกคน">
    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="Cool Courses - คอร์สเรียนสำหรับครูไทย | CoolCom">
    <meta property="og:description" content="คอร์สเรียนออนไลน์ดี ๆ หลากหลายหลักสูตร สำหรับครูไทยทุกคน">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1ZlwJVV6rZ0Atekv3QCXnIfKiK1587em5">
    <meta property="og:url" content="https://coolcom.click/courses.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1lkEII-FEDJpZt4dCuCa5-WU1ivEm8joC&sz=w128">
</head>
<body>
    <div class="bg-diag-lines"></div>
    <div class="bg-blur light"></div>

    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Courses Section -->
    <section class="courses-main" style="padding-top: 7rem;">
        <div class="courses-inner" style="text-align: center; margin-bottom: 2rem;">
            <span class="page-hero-badge"><i class="fa-solid fa-graduation-cap"></i> Cool Courses</span>
            <h1 class="page-hero-title">คอร์สเรียนสำหรับ<span class="text-yellow">ครูไทย</span></h1>
            <p class="page-hero-sub">คอร์สเรียนออนไลน์ดี ๆ หลากหลายหลักสูตร เรียนได้ฟรีแบบไม่มีค่าใช้จ่าย</p>
            <!-- Search Bar -->
            <div class="courses-search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="course-search" placeholder="ค้นหาคอร์สที่คุณสนใจ...">
            </div>
            <!-- Filter Tags -->
            <div class="courses-tags">
                <button class="tag-btn active" data-cat="all">ทั้งหมด</button>
                <button class="tag-btn" data-cat="recommended">คอร์สแนะนำ</button>
                <button class="tag-btn" data-cat="exam">สอบครูผู้ช่วย</button>
                <button class="tag-btn" data-cat="coding">Coding</button>
                <button class="tag-btn" data-cat="ai">AI & Technology</button>
                <button class="tag-btn" data-cat="media">สื่อการสอน</button>
                <button class="tag-btn" data-cat="tools">เครื่องมือครู</button>
            </div>
        </div>
        <div class="courses-inner">
            <!-- Regular Course Grid -->
            <h2 class="courses-section-label"><i class="fa-solid fa-th-large" style="color:#FFC300"></i> คอร์สทั้งหมด</h2>
            <div class="courses-grid" id="courses-grid">
                <!-- Courses will be dynamically injected here by js/renderCourses.js -->
            </div>

            <!-- Load More -->
            <div class="courses-load-more">
                <button class="btn-load-more">ดูคอร์สเพิ่มเติม <i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer"></footer>

    <script src="navbar.js"></script>
    <script type="module" src="js/renderCourses.js"></script>
    <script>
        // Page transition on link click - Smooth fade out
        document.querySelectorAll('a[href$=".html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    e.preventDefault();
                    // Smooth fade out all content except navbar with slide down
                    document.querySelectorAll('body > *:not(#navbar-container)').forEach(el => {
                        el.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                    });
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });
    </script>
    <script src="footer.js"></script>
<script type="module" src="js/visitorTracker.js"></script></body>
</html>
