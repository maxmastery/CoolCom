<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CoolCom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" href="https://kdeiauloliuojwadbzfd.supabase.co/storage/v1/object/public/coolcom-media/CoolCom%20media/Coolcom%20favicon.png">
</head>
<body class="admin-body">
    <div class="login-container">
        <div class="login-box">
            <img src="https://ui-avatars.com/api/?name=Admin+CoolCom&background=FFC300&color=000&rounded=true" alt="Admin Logo" width="80">
            <h1>CoolCom Admin</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@coolcom.click" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div id="error-msg" style="color: #ef4444; margin-bottom: 1rem; font-size: 0.9rem; display: none;"></div>
                <button type="submit" class="btn-primary" id="login-btn">เข้าสู่ระบบ (Login)</button>
            </form>
        </div>
    </div>

    <!-- Load Supabase and Auth JS -->
    <script type="module">
        import { supabase } from '../js/supabaseClient.js';
        
        // เช็คก่อนว่ามี session แล้วล็อกอินไว้หรือยัง ถ้ามีให้เด้งไป index.html ทันที
        async function checkSession() {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                window.location.href = 'index.html';
            }
        }
        checkSession();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'กำลังโหลด...';
            errorMsg.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password,
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'เข้าสู่ระบบ (Login)';
            } else {
                // Check if admin
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                if (profile && profile.role === 'admin') {
                    window.location.href = 'index.html';
                } else {
                    await supabase.auth.signOut();
                    errorMsg.textContent = 'คุณไม่มีสิทธิ์ผู้ดูแลระบบ';
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'เข้าสู่ระบบ (Login)';
                }
            }
        });
    </script>
</body>
</html>
