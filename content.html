<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolCom Content | CoolCom</title>
    <meta name="description" content="คอนเทนต์แนวเทคโนโลยีที่คอยแนะนำเทคนิคดี ๆ สำหรับการทำงานของคุณครู">
    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="CoolCom Content | CoolCom">
    <meta property="og:description" content="คอนเทนต์แนวเทคโนโลยีที่คอยแนะนำเทคนิคดี ๆ สำหรับการทำงานของคุณครู">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1ZlwJVV6rZ0Atekv3QCXnIfKiK1587em5">
    <meta property="og:url" content="https://coolcom.click/content.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://kdeiauloliuojwadbzfd.supabase.co/storage/v1/object/public/coolcom-media/CoolCom%20media/Coolcom%20favicon.png">
    <style>
        .page-hero-title { color: #fff !important; }
    </style>
</head>
<body class="content-page">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <section class="content-page-hero" style="padding-top: 7rem;">
        <div class="video-showcase-glow"></div>
        <span class="page-hero-badge"><i class="fa-brands fa-youtube"></i> Youtube Channel</span>
        <h1 class="page-hero-title">CoolCom <span class="text-yellow">Content</span></h1>
    </section>

    <!-- Video Cards Grid -->
    <section class="content-videos-section">
        <div class="content-videos-grid">
            <!-- Dynamic content will be loaded here -->
        </div>

        <!-- More Videos Button -->
        <div class="content-more-btn-wrapper">
            <a href="https://www.youtube.com/@CoolCom" target="_blank" class="content-more-btn"><i class="fa-brands fa-youtube"></i> รับชมวิดีโอเพิ่มเติม</a>
        </div>
    </section>

    <footer class="site-footer"></footer>
    <script src="navbar.js"></script>
    <script type="module" src="js/renderContent.js"></script>
    <script>
        // Page transition on link click - Smooth fade out
        document.querySelectorAll('a[href$=".html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    e.preventDefault();
                    // Smooth fade out all content except navbar with slide down
                    document.querySelectorAll('body > *:not(#navbar-container)').forEach(el => {
                        el.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                    });
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });
    </script>
    <script src="footer.js"></script>
<script type="module" src="js/visitorTracker.js"></script></body>
</html>
